look: "Uso: look [objetivo]\nSinónimo: l, mirar\nTe permite observar tu entorno, un objeto, o a una persona para obtener más detalles."
mirar: "Uso: mirar [objetivo]\nSinónimo: look, l\nTe permite observar tu entorno, un objeto, o a una persona para obtener más detalles."
l: "Uso: l [objetivo]\nSinónimo: look, mirar\nTe permite observar tu entorno, un objeto, o a una persona para obtener más detalles."
move: "Uso: move <dirección>\nSinónimo: mover, n, s, e, o, up, down\nTe desplazas hacia una salida abierta de la sala actual."
mover: "Uso: mover <dirección>\nSinónimo: move, n, s, e, o, up, down\nTe desplazas hacia una salida abierta de la sala actual."
get: "Uso: get <objeto|all|.>\nSinónimo: coger\nRecoges un objeto de la sala. Soporta comodines:\n- <yellow>get all</yellow>: coge todo lo posible de la sala.\n- <yellow>get . <contenedor></yellow>: coge todo el contenido de un cofre/bolsa."
coger: "Uso: coger <objeto|all|.>\nSinónimo: get\nRecoges un objeto de la sala. Soporta comodines (ver help get)."
drop: "Uso: drop <objeto|all>\nSinónimo: soltar\nSueltas un objeto de tu inventario. Soporta <yellow>all</yellow> para soltarlo todo."
soltar: "Uso: soltar <objeto|all>\nSinónimo: drop\nSueltas un objeto de tu inventario (soporta all)."
equip: "Uso: equip [objeto]\nSinónimo: equipo, equipar\nSi no indicas nada, muestra tu equipamiento actual. Si indicas un objeto, lo equipa si es posible."
equipo: "Uso: equipo [objeto]\nSinónimo: equip, equipar\nSi no indicas nada, muestra tu equipamiento actual. Si indicas un objeto, lo equipa si es posible."
equipar: "Uso: equipar <objeto>\nSinónimo: equip, equipo\nTe equipas un objeto de tu inventario."
unequip: "Uso: unequip <objeto|ranura>\nSinónimo: desequipar\nDesequipa un objeto que lleves puesto (ej: unequip arma)."
desequipar: "Uso: desequipar <objeto|ranura>\nSinónimo: unequip\nDesequipa un objeto que lleves puesto (ej: desequipar arma)."
use: "Uso: use <objeto>\nSinónimos: usar, interactuar, tirar\nInteractúas con elementos de la sala o usas objetos mágicos/consumibles de tu inventario."
usar: "Uso: usar <objeto>\nSinónimos: use, interactuar, tirar\nInteractúas con elementos de la sala o usas objetos mágicos/consumibles de tu inventario."
interactuar: "Uso: interactuar <objeto>\nSinónimos: use, usar, tirar\nInteractúas con elementos de la sala o usas objetos mágicos/consumibles de tu inventario."
open: "Uso: open <dirección u objeto>\nSinónimo: abrir\nAbre puertas, cofres u otras salidas cerradas si tienes la llave."
abrir: "Uso: abrir <dirección u objeto>\nSinónimo: open\nAbre puertas, cofres u otras salidas cerradas si tienes la llave."
inventory: "Uso: inventory\nSinónimo: inventario, i\nMuestra los objetos que llevas en la bolsa."
inventario: "Uso: inventario\nSinónimo: inventory, i\nMuestra los objetos que llevas en la bolsa."
i: "Uso: i\nSinónimo: inventory, inventario\nMuestra los objetos que llevas en la bolsa."
score: "Uso: score\nSinónimo: puntuacion\nMuestra tus estadísticas principales, salud, recursos y atributos."
puntuacion: "Uso: puntuacion\nSinónimo: score\nMuestra tus estadísticas principales, salud, recursos y atributos."
who: "Uso: who\nMuestra una lista de todos los jugadores conectados actualmente al mundo de Inheron."
cronica: "Uso: cronica\nMuestra tu diario de aventuras actual, indicando misiones activas y listadas para entregar."
skills: "Uso: skills\nSinónimo: habilidades\nMuestra las habilidades que conoces."
habilidades: "Uso: habilidades\nSinónimo: skills\nMuestra las habilidades que conoces."
cast: "Uso: cast <habilidad> [objetivo]\nSinónimo: lanzar, c\nEjecuta una habilidad o hechizo."
lanzar: "Uso: lanzar <habilidad> [objetivo]\nSinónimo: cast, c\nEjecuta una habilidad o hechizo."
c: "Uso: c <habilidad> [objetivo]\nSinónimo: cast, lanzar\nEjecuta una habilidad o hechizo."
heal: "Uso: heal\nSinónimo: curar\nRegenera puntos de vida consumiendo energía fuera de combate."
curar: "Uso: curar\nSinónimo: heal\nRegenera puntos de vida consumiendo energía fuera de combate."
pulso: "Uso: pulso [1-4]\nSinónimo: p\nMuestra 4 sugerencias tácticas en el panel inferior durante el combate. Puedes escribir el número o hacer clic en el panel.\nEl panel incluye un monitor de efectos en vivo que muestra la duración restante de tus buffs (en cian) y los debuffs en tus enemigos (en rojo)."
p: "Uso: p [1-4]\nSinónimo: pulso\nMuestra 4 sugerencias tácticas en el panel inferior durante el combate."
kill: "Uso: kill <objetivo>\nSinónimo: matar, k\nInicias un combate contra la criatura o jugador indicado."
matar: "Uso: matar <objetivo>\nSinónimo: kill, k\nInicias un combate contra la criatura o jugador indicado."
k: "Uso: k <objetivo>\nSinónimo: kill, matar\nInicias un combate contra la criatura o jugador indicado."
flee: "Uso: flee\nSinónimo: huir\nIntentas escapar de un combate activo."
huir: "Uso: huir\nSinónimo: flee\nIntentas escapar de un combate activo."
talk: "Uso: talk <NPC>\nSinónimo: hablar\nInicias una conversación con un NPC en la sala. Es vital para aceptar y completar misiones."
hablar: "Uso: hablar <NPC>\nSinónimo: talk\nInicias una conversación con un NPC en la sala. Es vital para aceptar y completar misiones."
list: "Uso: list [mercader]\nSinónimos: listar, tienda\nMuestra el inventario de un mercader."
listar: "Uso: listar [mercader]\nSinónimos: list, tienda\nMuestra el inventario de un mercader."
buy: "Uso: buy <objeto>\nSinónimo: comprar\nCompra un objeto de un mercader."
comprar: "Uso: comprar <objeto>\nSinónimo: buy\nCompra un objeto de un mercader."
sell: "Uso: sell <objeto>\nSinónimo: vender\nVende un objeto a un mercader."
vender: "Uso: vender <objeto>\nSinónimo: sell\nVende un objeto a un mercader."
say: "Uso: say <mensaje>\nSinónimo: decir\nHablas en voz alta. Todo el que esté en la sala te escuchará."
decir: "Uso: decir <mensaje>\nSinónimo: say\nHablas en voz alta. Todo el que esté en la sala te escuchará."
tell: "Uso: tell <jugador> <mensaje>\nSinónimo: susurrar\nEnvías un mensaje privado a otro jugador."
susurrar: "Uso: susurrar <jugador> <mensaje>\nSinónimo: tell\nEnvías un mensaje privado a otro jugador."
yell: "Uso: yell <mensaje>\nSinónimo: gritar\nGritas un mensaje para que sea oído en un radio mayor en la zona."
gritar: "Uso: gritar <mensaje>\nSinónimo: yell\nGritas un mensaje para que sea oído en un radio mayor en la zona."
ooc: "Uso: ooc <canal> <mensaje>\nEnvías un mensaje a través de canales globales (como el canal de charla general Out Of Character)."
prompt: "Uso: prompt [opción] [on|off]\nConfigura qué elementos visuales quieres ver en tu línea de estado."
help: "Uso: help [comando|habilidad|objeto]\nSinónimo: ayuda\nMuestra información útil sobre el juego."
admin: "<b>[ COMANDOS DE ADMINISTRACIÓN ]</b>\nAdmite abreviaturas (ej: <yellow>adm r</yellow> para room).\n- <yellow>goto <sala_id></yellow>  : Te teletransporta a una sala específica.\n- <yellow>summon <id></yellow>     : Invoca a un jugador o NPC ante ti.\n- <yellow>give <ítem_id></yellow>   : Te entrega un objeto (template id).\n- <yellow>spawn <npc_id></yellow>   : Crea un NPC en la sala actual.\n- <yellow>exterminate <str></yellow>: Elimina los NPCs instanciados que coincidan.\n- <yellow>refresh [id]</yellow>    : Restaura HP y recursos al 100%.\n- <yellow>set-level <n> [id]</yellow> : Cambia el nivel (recalcula stats).\n- <yellow>invul <on|off> [id]</yellow>: Activa/desactiva invulnerabilidad.\n- <yellow>player [id]</yellow>     : Muestra datos internos de un jugador.\n- <yellow>room</yellow>            : Muestra datos técnicos de la sala actual."
bardo: "<b>[ CLASE: BARDO DE CRÓNICA VIVA ]</b>\nEl Bardo no es un simple músico; es un tejedor de realidades que utiliza la <b>Crónica</b> para alterar el presente.\nSus mecánicas principales son:\n- <magenta>Voz</magenta>: Recurso para cantar (ver <yellow>help bardo voz</yellow>).\n- <magenta>Estrofa</magenta>: Ritmo de combate (ver <yellow>help bardo estrofa</yellow>).\n- <magenta>Aplauso</magenta>: Energía heroica (ver <yellow>help bardo aplauso</yellow>).\n- <magenta>Trama</magenta>: Límite de efectos activos (ver <yellow>help bardo trama</yellow>).\nAtributo principal: <yellow>Presencia</yellow>. Secundario: <yellow>Ingenio</yellow>."
bardo_voz: "<b>[ RECURSO: VOZ ]</b>\nEs el recurso básico del bardo para ejecutar canciones y notas.\n- <b>Máximo</b>: 100 + (Presencia * 5).\n- <b>Regeneración</b>: 8 + floor(Presencia / 2) por turno.\nSi tu voz llega a 0, podrías entrar en estado <red>Voz Quebrada</red>."
bardo_estrofa: "<b>[ MECÁNICA: ESTROFA ]</b>\nRepresenta el ritmo y la composición de tu actuación en combate (Máx. 5).\n- <green>Ganas +1</green> al usar una familia de habilidad distinta a la anterior (Nota -> Balada).\n- <red>Pierdes -1</red> si repites la misma familia tres veces seguidas.\n- <b>Estribillo</b>: A Estrofa 3, tus canciones ganan efectos adicionales."
bardo_aplauso: "<b>[ RECURSO: APLAUSO ]</b>\nSe genera mediante acciones notables del grupo o fallos críticos del enemigo.\n- Se usa para habilidades poderosas de \"Final de Acto\" o para forzar la realidad.\n- Ganas 1 punto cuando un aliado hace crítico o un enemigo falla por tus efectos."
bardo_trama: "<b>[ LÍMITE: TRAMA ]</b>\nRepresenta cuántos \"hilos\" o efectos mágicos puedes mantener activos a la vez.\n- <b>Límite inicial</b>: 3 hilos (sube con nivel).\n- Un efecto normal ocupa 1 hilo. Efectos mayores ocupan 2 hilos.\nSi superas tu límite, el hilo más antiguo se romperá o no podrás tejer nuevos."
bardo_eco: "<b>[ MECÁNICA: ECO ]</b>\nCuando una habilidad de bardo termina su duración, a menudo deja un <b>Eco</b>.\n- Los Ecos son versiones debilitadas de los efectos originales.\n- Se visualizan en el Pulso Táctico con barras oscurecidas y opacidad reducida.\n- Son fundamentales para encadenar combos de Armonía de larga duración."
ayuda: "Uso: ayuda [comando|habilidad|objeto]\nSinónimo: help\nMuestra información útil sobre el juego."
slot: "<b>[ COMANDO: SLOT / HOTBAR ]</b>\nUso: <yellow>slot <1-10> <comando|clear></yellow>\nConfigura accesos directos en tu barra de habilidades (hotbar) inferior.\n- <b>Asignar</b>: <yellow>slot 1 cast bardo_balada_viento</yellow>\n- <b>Limpiar</b>: <yellow>slot 1 clear</yellow>\n- <b>Uso</b>: Puedes pulsar las teclas del 1 al 0 o hacer clic directamente en la barra."
