- id: llanuras_0_0
  name: Borde de las Llanuras
  description: El inicio de las vastas llanuras doradas. Hacia el sur, se puede ver
    la entrada a los campos norteños de Villaclara.
  exits:
  - direction: south
    targetRoomId: llanuras_1_0
  - direction: east
    targetRoomId: llanuras_0_1
  - direction: south
    targetRoomId: villaclara_campo_norte
- id: llanuras_0_1
  name: Pastos Altos
  description: Rocas blanquecinas emergen esporádicamente entre el pasto alto, proporcionando
    algo de sombra escasa en este mar de hierba.
  exits:
  - direction: south
    targetRoomId: llanuras_1_1
  - direction: east
    targetRoomId: llanuras_0_2
  - direction: west
    targetRoomId: llanuras_0_0
- id: llanuras_0_2
  name: Colina de Viento Cálido
