- id: bosque_0_0
  name: Entrada al Bosque de los Ecos
  description: El borde del bosque marca una frontera abrupta entre la civilización
    y lo salvaje. Un camino tenue conduce hacia la plaza de Villaclara al norte.
  exits:
  - direction: south
    targetRoomId: bosque_1_0
  - direction: east
    targetRoomId: bosque_0_1
  - direction: north
    targetRoomId: villaclara_sur
- id: bosque_0_1
  name: Espesura del Bosque de los Ecos
  description: Los inmensos robles grises bloquean casi por completo la luz del sol.
    El aire huele a pino antiguo y humedad.
  exits:
  - direction: south
    targetRoomId: bosque_1_1
  - direction: east
    targetRoomId: bosque_0_2
  - direction: west
    targetRoomId: bosque_0_0
