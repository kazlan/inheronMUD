---
# Villaclara MVP canónico — NPCs
# Estado: propuesta no destructiva

- id: npc_dona_marga
  name: Doña Marga Panbendito
  description: >-
    Una panadera de mejillas sonrosadas, brazos de amasadora legendaria y ojos que
    detectan tristeza a veinte pasos. Lleva harina en el pelo, una medalla de la Luz
    en el delantal y la autoridad absoluta de quien alimenta a guardias, huérfanos
    y aventureros que aún no saben atarse las grebas.
  behaviorId: idle
  roomId: villaclara_panaderia
  flags: [social]
  metadata:
    raceId: humano_arvell
    merchant: true
    inventory: [item_pan_bendito, item_bollo_dulce, item_miga_bendita]
    ambientMessages:
      - "sacude harina de su delantal con energía."
      - "comprueba la temperatura de los hornos."
      - "tararea una canción sobre masa madre."
    greetings:
      - "{npc} te ofrece un pedacito de pan recién hecho con una sonrisa."
      - "{npc} se limpia las manos y saluda calurosamente a {player}."
    services:
      - id: bendecir_pan
        type: minor_buff
        cost: 5
    dialogues:
      - text: >-
          Come primero, presume después. Y si el pozo te canta un nombre que no es tuyo,
          no lo repitas con la boca llena.
      - requires_cronica:
          key: campo_norte_apaciguado
          min: 1
        text: >-
          Hoy las campanas han sonado limpias. Toma una miga bendita, que hasta los héroes
          hacen mejor ruido cuando no se desmayan.
  stats:
    fuerza: 12
    destreza: 10
    constitucion: 15
    ingenio: 10
    sabiduria: 12
    presencia: 14
    percepcion: 10

- id: npc_pex
  name: Pex
  description: >-
    Una criatura menuda, inclasificable y solemnemente húmeda, envuelta en una bufanda
    demasiado larga. Observa el Pozo Cantante como quien escucha una ópera privada.
    Cada vez que parpadea, parece haber entendido algo terrible y haber decidido pedir pan.
  behaviorId: idle
  roomId: villaclara_pozo_cantante
  flags: [social, weird]
  metadata:
    raceId: desconocido_amable
    ambientMessages:
      - "se asoma al pozo y parece asentir."
      - "ajusta su bufanda empapada."
      - "murmura palabras sueltas que suenan a nombres."
    greetings:
      - "{npc} parpadea lentamente hacia {player} y ladea la cabeza."
      - "{npc} señala el pozo y luego te señala a ti, sin decir palabra."
    dialogues:
      - text: >-
          Pex no cayó al pozo. El pozo subió a mirar a Pex. Diferencia importantísima.
      - text: >-
          Hoy el agua cantó doce nombres y mordió el trece. Maleducada, pero afinada.
    clueRoutes:
      camara_mediodia_inmovil:
        - dialogue
        - look: agua
  stats:
    fuerza: 3
    destreza: 14
    constitucion: 8
    ingenio: 16
    sabiduria: 18
    presencia: 11
    percepcion: 20

- id: npc_otilia_cuerda
  name: Otilia Cuerda
  description: >-
    Una registradora de moño severo, dedos veloces y paciencia peligrosamente afilada.
    Lleva cordeles de colores colgados del cinturón y recuerda nacimientos, deudas,
    apodos vergonzosos y quién prometió devolver una escalera en primavera.
  behaviorId: idle
  roomId: villaclara_archivo_cuerdas
  flags: [social]
  metadata:
    raceId: humano_altherion
    role: registro_nombres
    ambientMessages:
      - "hace un nudo complicado en un cordel."
      - "anota algo en el libro mayor con letra minúscula."
      - "suspira y reordena las cuerdas de la pared."
    greetings:
      - "{npc} levanta la vista del libro mayor y asiente hacia {player}."
      - "{npc} te saluda secamente, sin dejar de atar nudos."
    dialogues:
      - text: >-
          Si alguien vive en Villaclara, tiene nudo. Si no tiene nudo, o está de paso...
          o alguien ha metido tijera donde no debía.
      - requires_cronica:
          key: vio_tinta_blanca
          min: 1
        text: >-
          No toques esa tinta. No mancha los dedos: mancha los recuerdos.
    clueRoutes:
      nombres_borrados:
        - dialogue
        - look: libro_mayor
  stats:
    fuerza: 6
    destreza: 12
    constitucion: 9
    ingenio: 17
    sabiduria: 18
    presencia: 13
    percepcion: 16

- id: npc_bimba_cascabel
  name: Bimba Cascabel
  description: >-
    Campanera, recadera y amenaza pública para cualquier silencio solemne. Lleva una
    ristra de cascabeles en la muñeca y una libreta donde apunta qué campana sonó,
    quién se sobresaltó y si merecía la pena contarlo.
  behaviorId: idle
  roomId: villaclara_plaza
  flags: [social, wandering]
  metadata:
    raceId: humano_arvell
    ambientMessages:
      - "hace sonar un cascabel por accidente."
      - "tacha algo en su libreta frenéticamente."
      - "mira hacia el campanario con el ceño fruncido."
    greetings:
      - "{npc} agita la mano hacia {player}, haciendo sonar todos sus cascabeles."
      - "¡Eh, tú! {npc} te saluda con entusiasmo desmedido."
    routines:
      - time: dawn
        roomId: villaclara_plaza
        emote: "Bimba hace sonar dos campanadas pequeñas y una disculpa grande."
      - time: noon
        roomId: villaclara_iglesia
        emote: "Bimba cuenta los golpes de mediodía con el ceño fruncido."
    dialogues:
      - text: >-
          Si la campana da trece al mediodía, no mires al escribano. Bueno, míralo,
          pero de lado.
  stats:
    fuerza: 5
    destreza: 15
    constitucion: 8
    ingenio: 11
    sabiduria: 10
    presencia: 14
    percepcion: 15

- id: npc_varo_nomenclaro
  name: Varo Nomenclaro
  description: >-
    Un escribano pulcro, de sonrisa educada y tinta demasiado blanca para ser normal.
    Habla con cortesía impecable y mira los nombres propios como un joyero mira piedras
    valiosas: calculando cortes posibles.
  behaviorId: idle
  roomId: villaclara_gremio
  flags: [social]
  metadata:
    raceId: humano_altherion
    suspicion: subtle
    ambientMessages:
      - "limpia la plumilla con extremo cuidado."
      - "sopla suavemente sobre un pergamino para secar la tinta."
      - "sonríe de forma inquietantemente educada a la nada."
    greetings:
      - "{npc} hace una reverencia pulcra y saluda a {player}."
      - "{npc} te dedica una sonrisa ensayada y un asentimiento perfecto."
    dialogues:
      - text: >-
          Los registros solo ordenan lo que la memoria ensucia. Nadie debería temer
          una corrección bien hecha.
      - requires_cronica:
          key: contrato_sospechoso_examinado
          min: 1
        text: >-
          ¿Tinta blanca? Una herramienta administrativa. Muy útil para errores persistentes.
    clueRoutes:
      contratos_falsos:
        - dialogue
        - look: contrato_sospechoso
  stats:
    fuerza: 5
    destreza: 10
    constitucion: 8
    ingenio: 18
    sabiduria: 14
    presencia: 16
    percepcion: 13

- id: npc_silo_brincacepa
  name: Silo Brincacepa
  description: >-
    Un guardia rural de botas embarradas, lanza honrada y bigote con vocación de brújula.
    Conoce cada cerca rota del Campo Norte y habla de los conejos acorazados con el respeto
    que otros reservan a dragones fiscales.
  behaviorId: idle
  roomId: villaclara_puerta_norte
  flags: [social, guard]
  equipment:
    weapon: item_lanza_guardia
  metadata:
    raceId: humano_altherion
    ambientMessages:
      - "se atusa el bigote mirando hacia el norte."
      - "golpea la base de su lanza contra el suelo para quitarle barro."
      - "gruñe mirando una cerca rota a lo lejos."
    greetings:
      - "{npc} alza su lanza en señal de respeto hacia {player}."
      - "{npc} asiente gravemente y te saluda con voz ronca."
    dialogues:
      - text: >-
          Rango Cobre o no, si vas al Campo Norte mira la hierba. Cuando deja de moverse,
          algo con placas está decidiendo ser problema.
      - requires_flag: contrato_conejos_activo
        text: >-
          El General Pelusa no es chiste. Bueno, el nombre sí. Lo demás muerde.
  stats:
    fuerza: 14
    destreza: 11
    constitucion: 14
    ingenio: 8
    sabiduria: 11
    presencia: 12
    percepcion: 15

