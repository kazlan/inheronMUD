- id: npc_posadero_arnel
  name: Arnel Cántaro
  description: >-
    Un posadero ancho de hombros, barba corta y voz de manta gruesa. Seca jarras, recuerda
    deudas pequeñas y detecta peleas inminentes con precisión de meteorólogo cansado.
  behaviorId: idle
  roomId: comedor_cantaro_manso
  flags: [social]
  metadata:
    raceId: humano_arvell
    merchant: true
    inventory: [item_pan_bendito, item_bollo_dulce]
    innkeeper: true
    role: posadero
    ambientMessages:
      - "seca una jarra y vigila la sala con calma profesional."
      - "recoloca un banco como si hubiera ganado la discusión antes de empezar."
    greetings:
      - "{npc} asiente. 'Si traes barro, historias o heridas, entra por ese orden, {player}.'"
    dialogues:
      - text: "En mi comedor se puede mentir sobre monstruos, pero no sobre quién rompió la silla."
      - text: "Si buscas cama, sopa o silencio relativo, aquí aún nos defendemos bien."
  stats:
    fuerza: 13
    destreza: 8
    constitucion: 14
    ingenio: 11
    sabiduria: 12
    presencia: 13
    percepcion: 11

- id: npc_lina_jarras
  name: Lina Jarras
  description: >-
    Una camarera de trenza firme y ceja escéptica que atraviesa el comedor esquivando codos,
    cuentos y jarras vacías como si hubiera nacido entre mesas en movimiento.
  behaviorId: idle
  roomId: comedor_cantaro_manso
  flags: [social]
  metadata:
    raceId: humano_arvell
    role: camarera_y_radar_social
    ambientMessages:
      - "cruza la sala con una jarra en cada mano y una opinión en reserva."
      - "mira a un cliente fanfarrón como quien ya conoce el final del cuento."
    greetings:
      - "{npc} ladea la cabeza. 'Si buscas mesa, aún quedan. Si buscas drama, espera diez minutos, {player}.'"
    dialogues:
      - text: "Si alguien dice que venció solo a seis lobos, pregunta cuántos estaban ya muertos."
      - text: "La sopa de hoy no mata. Lo de mañana aún está en discusión."
  stats:
    fuerza: 7
    destreza: 15
    constitucion: 10
    ingenio: 11
    sabiduria: 10
    presencia: 12
    percepcion: 14

- id: npc_greta_huespedes
  name: Greta de los Libros Bajos
  description: >-
    Una viuda de modales tranquilos que vigila el pasillo de habitaciones con un chal, una
    llave maestra y la sospecha permanente de que los huéspedes esconden algo bajo la cama.
  behaviorId: idle
  roomId: segundo_piso_cantaro_manso
  flags: [social]
  metadata:
    raceId: humano_arvell
    role: guardiana_de_huespedes
    ambientMessages:
      - "alisa su chal y escucha el crujido del suelo como si tomara notas."
      - "comprueba una puerta cerrada con la delicadeza de quien no confía del todo en nadie."
    greetings:
      - "{npc} sostiene una llave. 'Habitación limpia, llave honrada y nada de morirse en las escaleras, {player}.'"
    dialogues:
      - text: "Si el suelo cruje de madrugada, puede ser un huésped, un borracho o un secreto. Los tres pagan distinto."
      - text: "Apunto entradas y salidas. Algunas personas olvidan eso; las tablas no."
  stats:
    fuerza: 7
    destreza: 9
    constitucion: 11
    ingenio: 13
    sabiduria: 15
    presencia: 12
    percepcion: 15

