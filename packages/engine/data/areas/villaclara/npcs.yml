---
# Villaclara — NPCs de prueba 2026-05-08

- id: npc_dona_marga
  name: Doña Marga Panbendito
  description: >-
    Una panadera de mejillas sonrosadas, brazos de amasadora legendaria y autoridad absoluta
    sobre hornos, aprendices y héroes con el estómago vacío.
  behaviorId: idle
  roomId: villaclara_panaderia
  flags: [social]
  metadata:
    raceId: humano_arvell
    merchant: true
    inventory: [item_pan_bendito, item_bollo_dulce, item_miga_bendita]
    role: panadera_refugio
    questHooks: [quest_campana_que_sobra]
    ambientMessages:
      - "limpia el mostrador con una severidad maternal."
      - "golpea una hogaza y asiente, satisfecha con su sonido."
    greetings:
      - "{npc} te mira de arriba abajo. 'Come primero, presume después, {player}.'"
    dialogues:
      - text: "Si vienes del norte con menos sangre que barro, has tenido un día aceptable."
      - text: "No repitas en voz alta los nombres que te cante el pozo. El pan sube mejor sin eso."
  stats:
    fuerza: 12
    destreza: 10
    constitucion: 15
    ingenio: 10
    sabiduria: 12
    presencia: 14
    percepcion: 10

- id: npc_brin_tahonero
  name: Brin Tahonero
  description: >-
    Un mozo de panadería flaco, rápido y siempre empolvado de harina hasta las pestañas.
  behaviorId: idle
  roomId: almacen_panbendito
  flags: [social]
  metadata:
    raceId: humano_altherion
    role: mozo_de_almacen
    ambientMessages:
      - "repasa sacos y cajas con la tensión de quien teme decepcionar a Doña Marga."
      - "se sacude harina del pelo y descubre que había más debajo."
    greetings:
      - "{npc} alza un saco a medio contar. 'Si vienes a ayudar, bendita seas. Si vienes a tocar harina, aléjate con respeto, {player}.'"
    dialogues:
      - text: "No, no puedes dormir sobre los sacos. Sí, ya lo intentaron antes."
      - text: "La harina no se cuenta sola, pero se desparrama con un entusiasmo admirable."
  stats:
    fuerza: 8
    destreza: 13
    constitucion: 9
    ingenio: 10
    sabiduria: 9
    presencia: 9
    percepcion: 12

- id: npc_otilia_cuerda
  name: Otilia Cuerda
  description: >-
    Una registradora de moño severo y dedos veloces. Lleva cordeles de colores al cinturón y
    mira los errores como si fueran delitos personales.
  behaviorId: idle
  roomId: villaclara_archivo_cuerdas
  flags: [social]
  metadata:
    raceId: humano_altherion
    role: guardiana_del_registro
    questHooks: [quest_campana_que_sobra, quest_otilia_no_existe]
    ambientMessages:
      - "revisa un nudo, frunce el ceño y vuelve a revisarlo."
      - "sopla sobre el libro mayor sin apartar la mirada de la tinta blanca."
    greetings:
      - "{npc} carraspea. 'Nombre, motivo y manos quietas, {player}.'"
    dialogues:
      - text: "Si alguien vive en Villaclara, tiene nudo. Si no tiene nudo, alguien ha tocado donde no debía."
      - text: "La tinta blanca no corrige. Suaviza ausencias, que es bastante peor."
  stats:
    fuerza: 6
    destreza: 12
    constitucion: 9
    ingenio: 17
    sabiduria: 18
    presencia: 13
    percepcion: 16

- id: npc_bimba_cascabel
  name: Bimba Cascabel
  description: >-
    Campanera, recadera y problema profesional para cualquier silencio solemne. Lleva cascabeles
    en la muñeca y una libreta donde apunta golpes, caras y supersticiones.
  behaviorId: idle
  roomId: villaclara_plaza
  flags: [social, patrol]
  metadata:
    raceId: humano_arvell
    role: campanera_y_recadera
    questHooks: [quest_campana_que_sobra]
    patrolPath: [villaclara_plaza, cuesta_de_las_campanas, atrio_de_la_luz, jardines_de_la_capilla, cuesta_de_las_campanas, villaclara_plaza]
    patrolMsgLeave: "<gray>Bimba Cascabel sale trotando mientras agita sus cascabeles.</gray>"
    patrolMsgArrive: "<gray>Bimba Cascabel llega corriendo, dejando un rastro de tintineos.</gray>"
    ambientMessages:
      - "cuenta campanadas con los dedos y vuelve a empezar por desconfianza."
      - "agita la muñeca y sus cascabeles responden antes que ella."
    greetings:
      - "{npc} sonríe. 'Si vienes por las campanas, llegan tarde. Si vienes por problemas, llegan antes, {player}.'"
    dialogues:
      - text: "Si la campana da trece al mediodía, no mires al escribano. Bueno, míralo, pero de lado."
      - text: "Las campanas no mienten. A veces solo son creativas."
  stats:
    fuerza: 5
    destreza: 15
    constitucion: 8
    ingenio: 11
    sabiduria: 10
    presencia: 14
    percepcion: 15

- id: npc_hermana_lua
  name: Hermana Lúa Candela
  description: >-
    Una clériga de voz baja, manos cálidas y mirada atenta. Tiende a las hierbas del jardín,
    a los heridos del pueblo y a las dudas que llegan con barro en las botas.
  behaviorId: idle
  roomId: jardines_de_la_capilla
  flags: [social, healer]
  metadata:
    raceId: humano_altherion
    role: cleriga_sanadora
    questHooks: [quest_otilia_no_existe]
    ambientMessages:
      - "ordena vendas y hierbas con una calma casi contagiosa."
      - "revisa los lirios como si también atendiera sus dolencias."
    greetings:
      - "{npc} inclina la cabeza. 'Pasa con paz. Si no la traes, aún podemos improvisarla un poco, {player}.'"
    dialogues:
      - text: "La Luz no siempre responde con truenos. A veces responde con vendajes limpios y sopa caliente."
      - text: "En el camposanto reposan los nombres. Por eso duele tanto cuando uno parece moverse."
  stats:
    fuerza: 5
    destreza: 8
    constitucion: 10
    ingenio: 14
    sabiduria: 20
    presencia: 15
    percepcion: 13

- id: npc_mirta_jardinera
  name: Mirta de los Setos
  description: >-
    Una jardinera robusta, de manos terrosas y paciencia vegetal. Recorta rosales, trasplanta
    hierbas y habla con las raíces como si le debieran respuestas atrasadas.
  behaviorId: idle
  roomId: jardines_de_la_capilla
  flags: [social]
  metadata:
    raceId: humano_arvell
    merchant: true
    inventory: [item_miga_bendita]
    role: jardinera_del_atrio
    ambientMessages:
      - "aprieta la tierra alrededor de una planta con precisión casi judicial."
      - "mira un rosal torcido como si estuviera confesando algo."
    greetings:
      - "{npc} te mide las botas. 'Písame los setos y te entierro con educación, {player}.'"
    dialogues:
      - text: "Las plantas y la gente se parecen más de lo que admiten: ambas se tuercen cuando las cambian de nombre demasiadas veces."
      - text: "Si ves tierra removida donde no toca, avisa. O cava. Pero avisa primero."
  stats:
    fuerza: 11
    destreza: 10
    constitucion: 13
    ingenio: 9
    sabiduria: 14
    presencia: 10
    percepcion: 14

- id: npc_pex
  name: Pex
  description: >-
    Una criatura menuda, inclasificable y solemnemente húmeda, envuelta en una bufanda demasiado
    larga. Observa el pozo como quien escucha una ópera privada.
  behaviorId: idle
  roomId: villaclara_pozo_cantante
  flags: [social, weird, wandering]
  metadata:
    raceId: desconocido_amable
    role: testigo_errante_del_pozo
    ambientMessages:
      - "inclina la cabeza hacia el agua y asiente como si la hubiera contradicho."
    greetings:
      - "{npc} te mira con gravedad anfibia. 'No cayó Pex al pozo. Subió el pozo a mirar a Pex, {player}.'"
    dialogues:
      - text: "Hoy el agua cantó doce nombres y mordió el trece. Muy mala educación."
      - text: "Si una campana sobra y un nombre falta, eso ya casi es aritmética."
  stats:
    fuerza: 3
    destreza: 14
    constitucion: 8
    ingenio: 16
    sabiduria: 18
    presencia: 11
    percepcion: 20

