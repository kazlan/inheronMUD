- id: anciano_sabio
  name: Anciano Sabio
  description: Un anciano de barba larga y túnica raída que observa la plaza con ojos penetrantes. Se apoya en un bastón de madera nudosa, acariciando su barba pensativamente. Su sola presencia exige respeto.
  behaviorId: idle
  roomId: villaclara_plaza
  flags: ['social']
  stats:
    fuerza: 5
    destreza: 5
    constitucion: 10
    ingenio: 20
    sabiduria: 25
    presencia: 15
    percepcion: 10
  metadata:
    raceId: humano_altherion
    dialogues:
      - requires_flag: quest_lobos_done
        text: "La paz ha vuelto a los campos. Gracias a ti, joven héroe."
      - requires_cronica:
          key: lobos_muertos
          min: 3
        text: "¡Has eliminado a la plaga! Siento que el equilibrio se restaura."
        set_flag: quest_lobos_done
      - requires_not_flag: quest_lobos_assigned
        text: "Las llanuras de ámbar están plagadas de bestias. ¿Te atreverías a cazar a 3 lobos hambrientos por el bien del pueblo?"
        set_flag: quest_lobos_assigned
      - text: "Ten cuidado ahí fuera, los lobos hambrientos no tienen piedad."

